# 8G heap + 4G metaspace asked for 12G of commit on a 12G machine, which is how
# a build ended with "Could not start thread DartWorker" — Windows had no commit
# left to give the Dart VM. 4G is comfortably above what this app needs to
# compile and leaves room for the analyzer, the daemon and the device.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin's incremental compiler relativizes source paths against the build
# directory and throws "this and base files have different roots" when they sit
# on different drives. The pub cache is on C: and this project is on D:, so
# every plugin with Kotlin sources (share_plus, mobile_scanner,
# flutter_image_compress_common, ...) failed to compile. Incremental buys
# nothing on CI and cannot work in this layout locally.
kotlin.incremental=false

# By default each Kotlin module compiles in its own worker JVM, several at once.
# On a 12G machine with C: full, Windows could not start them at all:
#   CreateProcess error=1455, The paging file is too small
#   CreateProcess error=8, Not enough memory resources are available
# Compiling inside the Gradle daemon spawns no extra processes, and one worker
# at a time keeps the peak inside the 4G above. Slower, but it finishes.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=true
