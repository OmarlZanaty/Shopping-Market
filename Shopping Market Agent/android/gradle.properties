# Heap went 8G -> 4G -> 1536m. 4G still crashed the daemon ("Native memory
# allocation (mmap) failed to map 769654784 bytes") because C: sits at ~0.15G
# free, so Windows has no commit to hand out no matter how much RAM is idle —
# the heap ceiling, not the heap usage, is what has to fit. 1536m builds this
# app fine; raise it only after C: has several GB free.
# HeapDumpOnOutOfMemoryError is deliberately off: on OOM it writes a multi-GB
# .hprof to a disk that is already the reason for the OOM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# The settings below mirror the customer app, which hit the same wall on this
# machine. Parallelism is what kills the build: with C: near-full there is no
# commit left, so extra JVMs die with "Gradle build daemon disappeared" or
# "CreateProcess error=1455, The paging file is too small". One worker, no
# parallelism, and Kotlin compiling inside the daemon keeps the peak under the
# 4G above — slower, but it finishes.
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process

# Kotlin's incremental compiler relativizes source paths against the build dir
# and throws "this and base files have different roots" when they sit on
# different drives. The pub cache is on C: and this project is on D:.
kotlin.incremental=false

android.useAndroidX=true
