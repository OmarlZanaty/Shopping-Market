resolver 127.0.0.11 valid=10s ipv6=off;

# Shared proxy locations (used by both :80 and :443)
map $host $unused { default 0; }

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    location /static/ { alias /app/static/; expires 30d; add_header Cache-Control "public, no-transform"; }
    location /media/  { alias /app/media/;  expires 7d;  add_header Cache-Control "public"; }

    location ~ ^/(api|django-admin|privacy-policy)/ {
        set $django http://shoppingmarket-backend:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /ws/ {
        set $django_ws http://shoppingmarket-backend:8000;
        proxy_pass $django_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    location / {
        set $admin_spa http://shoppingmarket-admin:80;
        proxy_pass $admin_spa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 63-186-157-245.sslip.io;
    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/63-186-157-245.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/63-186-157-245.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ { alias /app/static/; expires 30d; add_header Cache-Control "public, no-transform"; }
    location /media/  { alias /app/media/;  expires 7d;  add_header Cache-Control "public"; }

    location ~ ^/(api|django-admin|privacy-policy)/ {
        set $django https://shoppingmarket-backend:8000;
        set $django http://shoppingmarket-backend:8000;
        proxy_pass $django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /ws/ {
        set $django_ws http://shoppingmarket-backend:8000;
        proxy_pass $django_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    location / {
        set $admin_spa http://shoppingmarket-admin:80;
        proxy_pass $admin_spa;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
