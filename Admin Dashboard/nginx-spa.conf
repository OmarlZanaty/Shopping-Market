server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed filenames (index-DiB7pLjh.js), so a given URL can
  # never change content — cache it forever. One header only: `expires` also
  # writes Cache-Control, so pairing it with add_header sent two conflicting
  # Cache-Control lines.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    add_header Cache-Control "public, immutable, max-age=31536000" always;
  }

  # index.html is the only file that names the current bundle, so it has to be
  # revalidated on every load. It previously went out with just ETag and
  # Last-Modified and no Cache-Control, which lets browsers apply heuristic
  # freshness and serve it from cache for hours — a deploy then reached only
  # the people who happened to hard-refresh. no-cache still allows a 304 via
  # ETag, so this costs one conditional request, not a re-download.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }
}
